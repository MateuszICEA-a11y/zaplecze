baseURL = "https://busmaniak.pl/"
languageCode = "pl"
title = "BusManiak.pl"
theme = "theme"
themesDir = "../../shared"

summaryLength = 30

# Data ostatniej modyfikacji zasila „Ostatnia aktualizacja", <lastmod>
# w sitemapie i dateModified w schema.org.
#
# `lastmod` (frontmatter) MUSI być przed `:git`: Cloudflare Pages klonuje repo
# płytko, więc enableGitInfo widzi tam jeden commit i nadałby wszystkim stronom
# datę builda (sprawdzone na prodzie – 439 stron z identyczną datą). Daty
# wpisuje do plików `pipeline/stamp-lastmod.py` na podstawie historii gita;
# uruchom go po każdym przejeździe redakcyjnym, przed commitem.
#
# `:git` zostaje jako fallback dla plików bez wpisanego lastmod.
enableGitInfo = true

[frontmatter]
  lastmod = ["lastmod", ":git", ":fileModTime", ":default"]

[pagination]
  pagerSize = 12
enableRobotsTXT = true

[params]
  description = "Portal o busach, vanach i kamperach – Ducato, Sprinter, Iveco Daily. Porównania, zabudowy, przeróbki, kalkulatory."
  ogImage = "/images/og-default.jpg"
  noindex = false

[taxonomies]
  category = "categories"

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

