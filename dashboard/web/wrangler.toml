# Osobny worker podglądu nowego frontu – NIE nadpisuje produkcyjnego
# `zaplecze-dashboard`. Deploy ręczny: npm run build && npx wrangler deploy
# (pierwszy raz dodatkowo: npx wrangler secret put DASH_PASSWORD).
name = "zaplecze-dashboard-next"
compatibility_date = "2026-05-06"
main = "worker.js"

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
